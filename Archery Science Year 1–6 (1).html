lever:()=>v(`<path d="M100 90l-12-26h24z" fill="#a1887f"/><path d="M30 72L170 52" stroke-width="6"/><text x="12" y="70" font-size="18" stroke="none">🧒</text><text x="165" y="50" font-size="18" stroke="none">🧒</text>`+T(84,98,l("Lever","Tuas"))),
ramp:()=>v(`<path d="M20 85L170 85L170 35z" fill="#bcaaa4"/><rect x="60" y="62" width="14" height="14" fill="#fb8c00" transform="rotate(-14 67 69)"/>`+T(50,97,l("Inclined plane","Satah condong")))};
const DG={};[["ruler","0.1"],["lung","1.0 1.2 1.4"],["leaf","3.0 3.1 3.2 3.3 3.4 3.5 3.8"],["mirror","4.3 4.8"],["shadow","4.1 4.2 4.9"],["refr","4.6 4.7"],["sound","5.0 5.3 5.5"],["solar","8.0 8.1 8.2 8.4 8.5 8.6 8.7 8.9"],["lever","9.2 9.8 9.9"],["ramp","9.3"]].forEach(([k,s])=>s.split(" ").forEach(x=>DG[x]=k));
function menu(){run=false;cv.style.display="none";$("p").innerHTML="";$("g").innerHTML=`<button onclick=lang()>${u("lang")}</button><button onclick=lb()>🏆 ${u("lb")}</button><div>${[1,2,3,4,5,6].map(y=>`<button class="${y==Y?"go":""}" onclick=setY(${y})>${l("Year ","Tahun ")}${y}</button>`).join("")}</div><h2>${u("ch")}</h2><div class=grid>`+D.map((d,i)=>`<button class=t ${d[2]?`onclick=start(${i})`:"disabled style=opacity:.5"}>${d[2]?d[1]:"🔒"}<br><b>${i+1}. ${N[L][i]}</b>${d[2]?"":"<br><small>"+l("Coming soon","Akan datang")+"</small>"}${best[Y+'.'+i]!=null?`<br><small>${u("best")} ${best[Y+'.'+i]}/8</small>`:""}</button>`).join("")+"</div>"}
Object.keys(DG).filter(k=>k[0]=="8").forEach(k=>delete DG[k]);
function lang(){L=L=="en"?"ms":"en";menu()}
function ask(){const r=rw(S.t,S.q),k=Y==4&&DG[S.t+"."+ix(S.t,S.q)];S.o=sh([r[2],r[3],r[4]]);ar=null;stuck=null;$("g").innerHTML=`<div class=p><small>${N[L][S.t]} · ${u("qn")} ${S.q+1}/8 · ${u(S.q<2?"e":S.q<5?"m":"h")} · ✅ ${S.c} · 🎯 ${S.p}</small>${k?V[k]():`<div class=em>${r[0]}</div>`}<h2>${r[1]}</h2>${S.o.map((o,i)=>`<button class=o onclick=pick(${i},this)>${o}</button>`).join("")}</div>`}
function pick(i,b){const r=rw(S.t,S.q),ok=S.o[i]==r[2];document.querySelectorAll(".o").forEach(x=>{x.disabled=true;if(x.textContent==r[2])x.classList.add("ok")});
if(ok){S.c++;b.classList.add("ok");$("p").innerHTML=`<div class=p><b>${u("ok")}</b><br><button class=go id=sb onclick=shoot()>${u("shoot")}</button></div>`}
else{b.classList.add("no");$("p").innerHTML=`<div class=p><b>${u("no")}${r[2]}</b><br><button class=go onclick=nxt()>${u("next")}</button></div>`}}
function fin(){const b=best[Y+'.'+S.t];if(b==null||S.c>b)best[Y+'.'+S.t]=S.c;cv.style.display="none";$("p").innerHTML="";const s=S.c>=7?"🌟🌟🌟":S.c>=5?"🌟🌟":S.c>=3?"🌟":"💪";
$("g").innerHTML=`<div class=p><div class=em>${s}</div><h2>${N[L][S.t]} ✔</h2><h2>${u("qs")}: ${S.c}/8</h2><h2>${u("ap")}: ${S.p}</h2><h2>⭐ ${S.c*10+S.p}/160</h2><p>${S.c>=7?u("g1"):S.c>=4?u("g2"):u("g3")}</p><input id=nm maxlength=14 style="padding:8px;border-radius:8px;border:2px solid var(--bd);background:var(--card);color:var(--fg)"><button class=go onclick=lbAdd()>🏆 ${u("sv")}</button><br><button onclick=start(${S.t})>${u("again")}</button><button onclick=menu()>${u("all")}</button></div>`;
$("nm").placeholder=u("nm");try{$("nm").value=localStorage.getItem("asy4n")||""}catch(x){}}
function lbGet(){try{return JSON.parse(localStorage.getItem("asy4lb")||"[]")}catch(x){return[]}}
function lbAdd(){const n=($("nm").value.trim()||"?").slice(0,14),a=lbGet();a.push({n,y:Y,t:S.t,s:S.c*10+S.p});a.sort((x,y)=>y.s-x.s);try{localStorage.setItem("asy4n",n);localStorage.setItem("asy4lb",JSON.stringify(a.slice(0,200)))}catch(x){}lb(S.t)}
function lb(t){cv.style.display="none";$("p").innerHTML="";const a=lbGet().filter(x=>(t==null||x.t==t&&(x.y||4)==Y)).slice(0,10);
$("g").innerHTML=`<div class=p><h2>🏆 ${u("lb")}${t==null?"":" · "+N[L][t]}</h2>`+(a.length?"<table style='margin:auto;text-align:left;border-spacing:10px 4px'>"+a.map((x,i)=>`<tr><td>${["🥇","🥈","🥉"][i]||i+1}</td><td>${e(x.n)}</td><td><small>${t==null?"Y"+(x.y||4)+" · "+DATA[x.y||4][x.t][0]:""}</small></td><td><b>${x.s}</b></td></tr>`).join("")+"</table>":`<p>${u("none")}</p>`)+`<p><small>${u("note")}</small></p><button class=go onclick=menu()>${u("back")}</button></div>`}
menu();
</script></body></html>
